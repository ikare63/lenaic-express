name: Mettre à jour Lénaïc Express

on:
  workflow_dispatch:
  push:
    paths:
      - "veilles.json"
      - "preferences.json"
      - "sources.json"
  schedule:
    # Toutes les 3 heures, à H+12 (UTC)
    - cron: "12 */3 * * *"

permissions:
  contents: write

concurrency:
  group: lenaic-express-news
  cancel-in-progress: true

jobs:
  update-news:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: gpt-5.6-luna
      # Double sécurité : au plus 20 requêtes de résumé par jour et ~0,90 $/mois.
      AI_DAILY_SUMMARY_LIMIT: "20"
      AI_MONTHLY_BUDGET_USD: "0.90"

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Construire l'édition et les résumés IA
        run: python scripts/fetch_news.py

      - name: Enregistrer la nouvelle édition
        run: |
          if git diff --quiet -- data/actualites.json data/ai-usage.json; then
            echo "Aucune modification à enregistrer."
            exit 0
          fi

          git config user.name "Lénaïc Express Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/actualites.json data/ai-usage.json
          git commit -m "Actualise Lénaïc Express"
          git push
